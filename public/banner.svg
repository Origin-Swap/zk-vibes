<svg width="680" height="520" viewBox="0 0 680 520" xmlns="http://www.w3.org/2000/svg">
  <title>ZK Proof of Vibes — Logo</title>
  <desc>Retro terminal hacker aesthetic logo for ZK Proof of Vibes protocol</desc>

  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&amp;family=VT323&amp;display=swap');
    </style>
    <filter id="glow-green">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glow-strong">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glow-soft">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <clipPath id="hex-clip">
      <polygon points="340,62 450,122 450,242 340,302 230,242 230,122"/>
    </clipPath>
  </defs>

  <!-- Dark background panel -->
  <rect x="40" y="20" width="600" height="480" rx="4" fill="#0a0a0a" stroke="#00ff41" stroke-width="0.5" opacity="0.95"/>

  <!-- Corner brackets top left -->
  <path d="M40,20 L40,60 M40,20 L80,20" fill="none" stroke="#00ff41" stroke-width="1.5"/>
  <!-- Corner brackets top right -->
  <path d="M640,20 L640,60 M640,20 L600,20" fill="none" stroke="#00ff41" stroke-width="1.5"/>
  <!-- Corner brackets bottom left -->
  <path d="M40,500 L40,460 M40,500 L80,500" fill="none" stroke="#00ff41" stroke-width="1.5"/>
  <!-- Corner brackets bottom right -->
  <path d="M640,500 L640,460 M640,500 L600,500" fill="none" stroke="#00ff41" stroke-width="1.5"/>

  <!-- Hex outer glow ring -->
  <polygon points="340,48 466,114 466,246 340,312 214,246 214,114"
    fill="none" stroke="#00ff41" stroke-width="0.5" opacity="0.2" filter="url(#glow-strong)"/>

  <!-- Hex background -->
  <polygon points="340,62 450,122 450,242 340,302 230,242 230,122"
    fill="#030f03" stroke="#00ff41" stroke-width="1" opacity="0.98"/>

  <!-- Inner hex ring -->
  <polygon points="340,78 436,132 436,234 340,288 244,234 244,132"
    fill="none" stroke="#00ff41" stroke-width="0.5" opacity="0.25"/>

  <!-- Circuit traces -->
  <line x1="244" y1="172" x2="436" y2="172" stroke="#00ff41" stroke-width="0.4" opacity="0.3"/>
  <line x1="244" y1="212" x2="436" y2="212" stroke="#00ff41" stroke-width="0.4" opacity="0.3"/>
  <line x1="310" y1="78" x2="310" y2="288" stroke="#00ff41" stroke-width="0.3" opacity="0.15"/>
  <line x1="370" y1="78" x2="370" y2="288" stroke="#00ff41" stroke-width="0.3" opacity="0.15"/>

  <!-- Circuit nodes -->
  <circle cx="310" cy="172" r="3" fill="#00ff41" opacity="0.7"/>
  <circle cx="370" cy="172" r="3" fill="#00ff41" opacity="0.7"/>
  <circle cx="310" cy="212" r="3" fill="#00ff41" opacity="0.5"/>
  <circle cx="370" cy="212" r="3" fill="#00ff41" opacity="0.5"/>
  <circle cx="340" cy="192" r="5" fill="#00ff41" opacity="0.9" filter="url(#glow-green)"/>

  <!-- ZK main text -->
  <text x="340" y="210" text-anchor="middle"
    font-family="'VT323', monospace" font-size="96" fill="#00ff41"
    opacity="0.95" filter="url(#glow-strong)">ZK</text>

  <!-- ZK glitch red -->
  <text x="337" y="210" text-anchor="middle"
    font-family="'VT323', monospace" font-size="96" fill="#ff2222"
    opacity="0.35" clip-path="url(#hex-clip)">ZK</text>

  <!-- ZK glitch cyan -->
  <text x="343" y="210" text-anchor="middle"
    font-family="'VT323', monospace" font-size="96" fill="#00ffff"
    opacity="0.25" clip-path="url(#hex-clip)">ZK</text>

  <!-- Hex outer border bright -->
  <polygon points="340,62 450,122 450,242 340,302 230,242 230,122"
    fill="none" stroke="#00ff41" stroke-width="1.5" filter="url(#glow-soft)"/>

  <!-- Tick marks -->
  <line x1="340" y1="62" x2="340" y2="70" stroke="#00ff41" stroke-width="1" opacity="0.6"/>
  <line x1="395" y1="92" x2="390" y2="100" stroke="#00ff41" stroke-width="1" opacity="0.4"/>
  <line x1="395" y1="212" x2="390" y2="204" stroke="#00ff41" stroke-width="1" opacity="0.4"/>
  <line x1="340" y1="302" x2="340" y2="294" stroke="#00ff41" stroke-width="1" opacity="0.6"/>
  <line x1="285" y1="212" x2="290" y2="204" stroke="#00ff41" stroke-width="1" opacity="0.4"/>
  <line x1="285" y1="92" x2="290" y2="100" stroke="#00ff41" stroke-width="1" opacity="0.4"/>

  <!-- Circuit traces from hex -->
  <path d="M230,182 L180,182 L180,160 L140,160" fill="none" stroke="#00ff41" stroke-width="0.8" opacity="0.5"/>
  <circle cx="140" cy="160" r="3" fill="#00ff41" opacity="0.7"/>
  <circle cx="180" cy="182" r="2" fill="#00ff41" opacity="0.5"/>

  <path d="M450,182 L500,182 L500,160 L540,160" fill="none" stroke="#00ff41" stroke-width="0.8" opacity="0.5"/>
  <circle cx="540" cy="160" r="3" fill="#00ff41" opacity="0.7"/>
  <circle cx="500" cy="182" r="2" fill="#00ff41" opacity="0.5"/>

  <path d="M258,240 L200,270 L200,296" fill="none" stroke="#00ff41" stroke-width="0.6" opacity="0.35"/>
  <circle cx="200" cy="296" r="2" fill="#00ff41" opacity="0.5"/>

  <path d="M422,240 L480,270 L480,296" fill="none" stroke="#00ff41" stroke-width="0.6" opacity="0.35"/>
  <circle cx="480" cy="296" r="2" fill="#00ff41" opacity="0.5"/>

  <!-- Wordmark -->
  <text x="340" y="362" text-anchor="middle"
    font-family="'VT323', monospace" font-size="52" fill="#00ff41"
    filter="url(#glow-green)" opacity="0.98" letter-spacing="8">ZK PROOF OF VIBES</text>

  <!-- Wordmark glitch -->
  <text x="337" y="362" text-anchor="middle"
    font-family="'VT323', monospace" font-size="52" fill="#ff2222"
    opacity="0.18" letter-spacing="8">ZK PROOF OF VIBES</text>

  <!-- Tagline -->
  <text x="340" y="396" text-anchor="middle"
    font-family="'Share Tech Mono', monospace" font-size="12" fill="#00aa2a"
    letter-spacing="3" opacity="0.85">// TRUSTLESS DEVELOPER REPUTATION PROTOCOL</text>

  <!-- Version tag -->
  <text x="340" y="420" text-anchor="middle"
    font-family="'Share Tech Mono', monospace" font-size="11" fill="#00ff41"
    opacity="0.3" letter-spacing="2">v1.0.0 · GROTH16 · MAINNET · EPOCH_47</text>

  <!-- Status bar -->
  <rect x="40" y="455" width="600" height="1" fill="#00ff41" opacity="0.15"/>
  <text x="60" y="476"
    font-family="'Share Tech Mono', monospace" font-size="11" fill="#00aa2a"
    opacity="0.7" letter-spacing="1">root@zkvibes:~$</text>
  <text x="178" y="476"
    font-family="'Share Tech Mono', monospace" font-size="11" fill="#00ff41"
    opacity="0.5" letter-spacing="1">iAmBuilding[0x...] = true</text>
  <text x="580" y="476" text-anchor="end"
    font-family="'Share Tech Mono', monospace" font-size="11" fill="#00ff41"
    opacity="0.4" letter-spacing="1">[VERIFIED]</text>

  <!-- Blinking cursor -->
  <rect x="583" y="465" width="8" height="13" fill="#00ff41" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0;0.7" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
